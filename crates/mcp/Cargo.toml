[package]
name = "sendgrid-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol (MCP) server exposing all 391 SendGrid v3 API operations to AI agents through a search → describe → invoke meta-tool surface."
readme = "README.md"
keywords = ["sendgrid", "email", "mcp", "api", "agent"]
categories = ["api-bindings", "email"]

[dependencies]
sendgrid-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# rmcp 3.1.2: stdio MCP server. We hand-implement `ServerHandler` (no `#[tool]`
# derive macros) so tool names + input schemas are built from runtime IR data.
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
# A localhost SendGrid mock the real ReqwestDispatcher drives end-to-end (via
# RuntimeConfig::base_url_override) to test the reveal/shaping/await behavior of
# invoke without a live network.
wiremock = "0.6"
# Client-side feature only, for `tests/protocol_smoke.rs`: drives a real MCP
# client against `SgServer` over an in-memory duplex transport, exercising the
# `ServerHandler` trait methods (not just the `dispatch_tool` router the
# `server.rs` unit tests call directly). Feature-unifies with the `[dependencies]`
# rmcp above (same version) rather than pulling a second copy.
rmcp = { version = "3.1.2", features = ["client"] }
